name: gpt-image-nas

services:
  studio:
    image: ${STUDIO_IMAGE:?请在 .env 中设置 STUDIO_IMAGE}
    container_name: gpt-image-studio
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${DATA_DIR:?请把 DATA_DIR 设置为 NAS 外部硬盘上的绝对目录}
        target: /data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_ENV: ${APP_ENV:-staging}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKEND_HTTP_HOST: 127.0.0.1
      BACKEND_HTTP_PORT: 8081
      API_READ_TIMEOUT: ${API_READ_TIMEOUT:-30s}
      API_WRITE_TIMEOUT: ${API_WRITE_TIMEOUT:-5m}
      API_SHUTDOWN_TIMEOUT: ${API_SHUTDOWN_TIMEOUT:-20s}
      MIGRATIONS_MODE: startup-gate
      STARTUP_TIMEOUT_SECONDS: ${STARTUP_TIMEOUT_SECONDS:-300}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-amazon_ai_image_studio}
      MYSQL_USER: ${MYSQL_USER:-studio_app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      MYSQL_CONNECT_TIMEOUT: ${MYSQL_CONNECT_TIMEOUT:-15s}
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-25}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-5}
      MYSQL_CONN_MAX_LIFETIME: ${MYSQL_CONN_MAX_LIFETIME:-30m}
      REDIS_ADDR: 127.0.0.1:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-studio_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-studio_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:-product-originals}
      MINIO_BUCKET_GENERATED: ${MINIO_BUCKET_GENERATED:-product-generated}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-product-thumbnails}
      MINIO_BROWSER: "off"
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?请设置 JWT_SIGNING_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-amazon-ai-product-image-studio}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-60}
      AUTH_LOGIN_RATE_LIMIT_MAX_FAILURES: ${AUTH_LOGIN_RATE_LIMIT_MAX_FAILURES:-5}
      AUTH_LOGIN_RATE_LIMIT_WINDOW: ${AUTH_LOGIN_RATE_LIMIT_WINDOW:-10m}
      AUTH_CAPTCHA_ENABLED: ${AUTH_CAPTCHA_ENABLED:-true}
      AUTH_CAPTCHA_TTL: ${AUTH_CAPTCHA_TTL:-2m}
      AUTH_DEFAULT_TENANT_ID: ${AUTH_DEFAULT_TENANT_ID:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-studio_auth}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_ENABLED: "true"
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-studio_csrf}
      CSRF_HEADER_NAME: X-CSRF-Token
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?请设置 API_KEY_ENCRYPTION_KEY}
      API_KEY_ENCRYPTION_KEY_ID: ${API_KEY_ENCRYPTION_KEY_ID:-nas-v1}
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-25}
      UPLOAD_MAX_WIDTH: ${UPLOAD_MAX_WIDTH:-8192}
      UPLOAD_MAX_HEIGHT: ${UPLOAD_MAX_HEIGHT:-8192}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-40000000}
      UPLOAD_ALLOWED_MIME_TYPES: image/jpeg,image/png,image/webp
      TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-image-tasks}
      TASK_ENQUEUE_TIMEOUT: ${TASK_ENQUEUE_TIMEOUT:-5s}
      TASK_CLAIM_TIMEOUT: ${TASK_CLAIM_TIMEOUT:-5s}
      TASK_VISIBILITY_TIMEOUT: ${TASK_VISIBILITY_TIMEOUT:-15m}
      TASK_RETRY_BACKOFF: ${TASK_RETRY_BACKOFF:-10s}
      TASK_RECOVERY_INTERVAL: ${TASK_RECOVERY_INTERVAL:-30s}
      TASK_CONCURRENCY_LEASE_TTL: ${TASK_CONCURRENCY_LEASE_TTL:-30m}
      TASK_MAX_DELIVERIES: ${TASK_MAX_DELIVERIES:-5}
      TASK_GLOBAL_CONCURRENCY: ${TASK_GLOBAL_CONCURRENCY:-8}
      TASK_POLICY_MAX_CONCURRENCY: ${TASK_POLICY_MAX_CONCURRENCY:-8}
      TASK_TENANT_CONCURRENCY: ${TASK_TENANT_CONCURRENCY:-2}
      TASK_USER_CONCURRENCY: ${TASK_USER_CONCURRENCY:-2}
      TASK_PROVIDER_CONCURRENCY: ${TASK_PROVIDER_CONCURRENCY:-2}
      TASK_MODEL_CONCURRENCY: ${TASK_MODEL_CONCURRENCY:-2}
      WORKER_NAME: ${WORKER_NAME:-nas-worker}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-30s}
      WORKER_HEALTHCHECK_FILE: /run/studio/worker-ready
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-600}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-1}
      PROVIDER_MAX_RESPONSE_SIZE_MB: ${PROVIDER_MAX_RESPONSE_SIZE_MB:-1024}
      PROVIDER_MAX_OUTPUT_IMAGE_SIZE_MB: ${PROVIDER_MAX_OUTPUT_IMAGE_SIZE_MB:-512}
      TMPDIR: /data/tmp
    tmpfs:
      - /run:rw,noexec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=256m
    shm_size: 512m
    pids_limit: 512
    mem_limit: ${MEMORY_LIMIT:-12g}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-20m}
        max-file: ${LOG_MAX_FILE:-5}
