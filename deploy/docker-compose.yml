name: ${COMPOSE_PROJECT_NAME:-amazon-ai-product-image-studio}

x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "${COMPOSE_LOG_MAX_SIZE:-10m}"
    max-file: "${COMPOSE_LOG_MAX_FILE:-3}"

services:
  frontend:
    image: ${FRONTEND_IMAGE:-amazon-ai-product-image-studio/frontend:local}
    build:
      context: ${FRONTEND_BUILD_CONTEXT:-../frontend}
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-docker.m.daocloud.io/library/node:24-alpine}
        NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.29-alpine}
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app
    logging: *json-file-logging
    restart: unless-stopped

  backend-api:
    image: ${BACKEND_API_IMAGE:-amazon-ai-product-image-studio/backend-api:local}
    build:
      context: ${BACKEND_BUILD_CONTEXT:-../backend}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      target: ${BACKEND_API_BUILD_TARGET:-api}
      args:
        GO_IMAGE: ${BACKEND_GO_IMAGE:-docker.m.daocloud.io/library/golang:1.25-alpine}
        ALPINE_IMAGE: ${BACKEND_ALPINE_IMAGE:-docker.m.daocloud.io/library/alpine:3.22}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKEND_HTTP_HOST: 0.0.0.0
      BACKEND_HTTP_PORT: ${BACKEND_HTTP_PORT:-8080}
      API_READ_TIMEOUT: ${API_READ_TIMEOUT:-15s}
      API_WRITE_TIMEOUT: ${API_WRITE_TIMEOUT:-15s}
      API_SHUTDOWN_TIMEOUT: ${API_SHUTDOWN_TIMEOUT:-10s}
      MIGRATIONS_MODE: ${MIGRATIONS_MODE:-startup-gate}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-amazon_ai_image_studio}
      MYSQL_USER: ${MYSQL_USER:-studio_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-mysql-password}
      MYSQL_CONNECT_TIMEOUT: ${MYSQL_CONNECT_TIMEOUT:-10s}
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-25}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-5}
      MYSQL_CONN_MAX_LIFETIME: ${MYSQL_CONN_MAX_LIFETIME:-30m}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-redis-password}
      REDIS_DB: ${REDIS_DB:-0}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-change-me-local-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-local-minio-password}
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:-product-originals}
      MINIO_BUCKET_GENERATED: ${MINIO_BUCKET_GENERATED:-product-generated}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-product-thumbnails}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-change-me-at-least-32-bytes-prod-must-replace}
      JWT_ISSUER: ${JWT_ISSUER:-amazon-ai-product-image-studio}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-60}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-studio_auth}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-studio_csrf}
      CSRF_HEADER_NAME: X-CSRF-Token
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:-change-me-32-byte-base64-key-prod-must-replace}
      API_KEY_ENCRYPTION_KEY_ID: ${API_KEY_ENCRYPTION_KEY_ID:-local-dev-v1}
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-25}
      UPLOAD_MAX_WIDTH: ${UPLOAD_MAX_WIDTH:-8192}
      UPLOAD_MAX_HEIGHT: ${UPLOAD_MAX_HEIGHT:-8192}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-40000000}
      UPLOAD_ALLOWED_MIME_TYPES: ${UPLOAD_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
      TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-image-tasks}
      TASK_ENQUEUE_TIMEOUT: ${TASK_ENQUEUE_TIMEOUT:-5s}
      TASK_CLAIM_TIMEOUT: ${TASK_CLAIM_TIMEOUT:-5s}
      TASK_VISIBILITY_TIMEOUT: ${TASK_VISIBILITY_TIMEOUT:-5m}
      TASK_RETRY_BACKOFF: ${TASK_RETRY_BACKOFF:-5s}
      TASK_RECOVERY_INTERVAL: ${TASK_RECOVERY_INTERVAL:-30s}
      TASK_CONCURRENCY_LEASE_TTL: ${TASK_CONCURRENCY_LEASE_TTL:-10m}
      TASK_MAX_DELIVERIES: ${TASK_MAX_DELIVERIES:-5}
      TASK_GLOBAL_CONCURRENCY: ${TASK_GLOBAL_CONCURRENCY:-4}
      TASK_TENANT_CONCURRENCY: ${TASK_TENANT_CONCURRENCY:-2}
      TASK_USER_CONCURRENCY: ${TASK_USER_CONCURRENCY:-2}
      TASK_PROVIDER_CONCURRENCY: ${TASK_PROVIDER_CONCURRENCY:-2}
      TASK_MODEL_CONCURRENCY: ${TASK_MODEL_CONCURRENCY:-2}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-120}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-2}
    ports:
      - "${BACKEND_API_BIND_HOST:-127.0.0.1}:${BACKEND_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${BACKEND_HTTP_PORT:-8080}/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app
      - data
    logging: *json-file-logging
    restart: unless-stopped

  backend-worker:
    image: ${BACKEND_WORKER_IMAGE:-amazon-ai-product-image-studio/backend-worker:local}
    build:
      context: ${BACKEND_BUILD_CONTEXT:-../backend}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      target: ${BACKEND_WORKER_BUILD_TARGET:-worker}
      args:
        GO_IMAGE: ${BACKEND_GO_IMAGE:-docker.m.daocloud.io/library/golang:1.25-alpine}
        ALPINE_IMAGE: ${BACKEND_ALPINE_IMAGE:-docker.m.daocloud.io/library/alpine:3.22}
    depends_on:
      backend-api:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_NAME: ${WORKER_NAME:-backend-worker}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-10s}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_RETENTION_MAINTENANCE_INTERVAL: ${WORKER_RETENTION_MAINTENANCE_INTERVAL:-1h}
      WORKER_RETENTION_MAINTENANCE_BATCH_LIMIT: ${WORKER_RETENTION_MAINTENANCE_BATCH_LIMIT:-100}
      MIGRATIONS_MODE: ${MIGRATIONS_MODE:-startup-gate}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-amazon_ai_image_studio}
      MYSQL_USER: ${MYSQL_USER:-studio_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-mysql-password}
      MYSQL_CONNECT_TIMEOUT: ${MYSQL_CONNECT_TIMEOUT:-10s}
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-25}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-5}
      MYSQL_CONN_MAX_LIFETIME: ${MYSQL_CONN_MAX_LIFETIME:-30m}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-redis-password}
      REDIS_DB: ${REDIS_DB:-0}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-change-me-local-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-local-minio-password}
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:-product-originals}
      MINIO_BUCKET_GENERATED: ${MINIO_BUCKET_GENERATED:-product-generated}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-product-thumbnails}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-change-me-at-least-32-bytes-prod-must-replace}
      JWT_ISSUER: ${JWT_ISSUER:-amazon-ai-product-image-studio}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-60}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-studio_auth}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-studio_csrf}
      CSRF_HEADER_NAME: X-CSRF-Token
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:-change-me-32-byte-base64-key-prod-must-replace}
      API_KEY_ENCRYPTION_KEY_ID: ${API_KEY_ENCRYPTION_KEY_ID:-local-dev-v1}
      TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-image-tasks}
      TASK_ENQUEUE_TIMEOUT: ${TASK_ENQUEUE_TIMEOUT:-5s}
      TASK_CLAIM_TIMEOUT: ${TASK_CLAIM_TIMEOUT:-5s}
      TASK_VISIBILITY_TIMEOUT: ${TASK_VISIBILITY_TIMEOUT:-5m}
      TASK_RETRY_BACKOFF: ${TASK_RETRY_BACKOFF:-5s}
      TASK_RECOVERY_INTERVAL: ${TASK_RECOVERY_INTERVAL:-30s}
      TASK_CONCURRENCY_LEASE_TTL: ${TASK_CONCURRENCY_LEASE_TTL:-10m}
      TASK_MAX_DELIVERIES: ${TASK_MAX_DELIVERIES:-5}
      TASK_GLOBAL_CONCURRENCY: ${TASK_GLOBAL_CONCURRENCY:-4}
      TASK_TENANT_CONCURRENCY: ${TASK_TENANT_CONCURRENCY:-2}
      TASK_USER_CONCURRENCY: ${TASK_USER_CONCURRENCY:-2}
      TASK_PROVIDER_CONCURRENCY: ${TASK_PROVIDER_CONCURRENCY:-2}
      TASK_MODEL_CONCURRENCY: ${TASK_MODEL_CONCURRENCY:-2}
      WORKER_HEALTHCHECK_FILE: ${WORKER_HEALTHCHECK_FILE:-/tmp/worker-ready}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-120}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-2}
    healthcheck:
      test: ["CMD-SHELL", "test -f \"$${WORKER_HEALTHCHECK_FILE:-/tmp/worker-ready}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app
      - data
    logging: *json-file-logging
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-mysql-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-amazon_ai_image_studio}
      MYSQL_USER: ${MYSQL_USER:-studio_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-mysql-password}
      TZ: ${TZ:-UTC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data
    logging: *json-file-logging
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7.4-alpine}
    command:
      - sh
      - -c
      - exec redis-server --appendonly "$${REDIS_APPENDONLY:-yes}" --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-redis-password}
      REDIS_APPENDONLY: ${REDIS_APPENDONLY:-yes}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - data
    logging: *json-file-logging
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-docker.m.daocloud.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me-local-minio-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio-password}
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - data
    logging: *json-file-logging
    restart: unless-stopped

  minio-bootstrap:
    image: ${MINIO_MC_IMAGE:-docker.m.daocloud.io/minio/mc:RELEASE.2025-04-16T18-13-26Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me-local-minio-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio-password}
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:-product-originals}
      MINIO_BUCKET_GENERATED: ${MINIO_BUCKET_GENERATED:-product-generated}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-product-thumbnails}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_ORIGINALS"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_GENERATED"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_THUMBNAILS"
    networks:
      - data
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
